# Fly.io deployment — `fly deploy` from this directory.
# The container reads $PORT (default 8080); internal_port must match.

app = "crdt-demo"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # No dedicated /healthz — GET / returns 200 and serves as liveness.
  [http_service.checks]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

# Smallest machine Fly offers; plenty for the demo.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
