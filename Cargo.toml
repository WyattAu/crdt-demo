[package]
name = "crdt-demo"
version = "0.1.0"
edition = "2021"
description = "Live multi-user CRDT collaborative-editing demo — crdts-kit + ws-kit, single binary"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
crdts-kit = { version = "0.1", features = ["serde"] }
ws-kit = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
